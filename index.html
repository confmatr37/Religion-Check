<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Religion Check</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="text-align: center;">Religion Check</h1>
    <div id="toolbar">
        <button class="color" data-color="black">Black</button>
        <button class="color" data-color="red">Red</button>
        <button class="color" data-color="blue">Blue</button>
        <button class="color" data-color="green">Green</button>
        <button class="color" data-color="orange">Orange</button>
        <button id="clear">Clear</button>
    </div>

       <div id="drawing-area">
        <div class="container"> 
            <img src= 
                "Hereford_Mappa_Mundi_1300.jpg"
                alt="Map of the World"> 
        </div> 
        <!-- <img id="background" src="Hereford_Mappa_Mundi_1300.jpg" alt="Map of the World">*/-->
        <canvas id="canvas"></canvas>
    </div>

    <div id = "myPopup" class="popup">
        <div class="popuptext">
            <h2>Congratulations!</h2>
            <!--Wow, you really dug this far? I suppose you can have a hint, in plaintext, but please don't decrypt the location.-->
            <p><i>Be who God meant you to be, and you will set the world on fire. - St. Catherine of Siena </i></p>
            <p id = "answer"></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
